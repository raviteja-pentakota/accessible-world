<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RT Online Mart - Admin Portal</title>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #707070;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 500px;
            background: #707070;
            padding: 20px;
        }
        h2 {
            color: #000;
        }
        label {
            display: block;
            margin-top: 10px;
            font-weight: bold;
            color: #000;
        }
        input, select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            margin-bottom: 15px;
            border: 1px solid #444;
            border-radius: 4px;
            box-sizing: border-box;
            background: #fff;
        }
        button {
            background-color: #006400;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }
        button:hover {
            background-color: #004d00;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>RT Online Mart - Add Product</h2>

    <label for="imageUrlInput">Cloudflare R2 Image Public URL</label>
    <input type="text" id="imageUrlInput" placeholder="Paste R2 public URL here">

    <label for="name">Product Name</label>
    <input type="text" id="name" placeholder="Product Name">

    <label for="weight">Weight / Size</label>
    <input type="text" id="weight" placeholder="Weight (e.g. 500g)">

    <label for="price">Regular Price</label>
    <input type="number" id="price" placeholder="Price (Rupees)">

    <label for="discount">Discounted Price (Optional)</label>
    <input type="number" id="discount" placeholder="Discounted Price (Optional)">

    <label for="category">Category</label>
    <select id="category">
        <option value="Grocery">Grocery</option>
        <option value="Fruits">Fruits</option>
        <option value="Vegetables">Vegetables</option>
        <option value="Drinks">Drinks</option>
        <option value="Dairy">Dairy</option>
        <option value="Meat">Meat</option>
        <option value="Home">Home</option>
    </select>

    <button onclick="uploadProduct()">Add Product to Database</button>
</div>

<script>
    // Your Firebase configuration
    const firebaseConfig = {
        apiKey: "AIzaSyDIoAwjZsgAaMbVDjPQ_MPoQGbXWX5PBbw",
        authDomain: "rt-online-mart.firebaseapp.com",
        databaseURL: "https://rt-online-mart-default-rtdb.firebaseio.com",
        projectId: "rt-online-mart",
        messagingSenderId: "753183334962",
        appId: "1:753183334962:web:e7c4fb4fae141b3c7e122b",
        measurementId: "G-EQBHD3NH4M"
    };
    
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    async function uploadProduct() {
        const imageUrl = document.getElementById('imageUrlInput').value.trim();
        const name = document.getElementById('name').value.trim();
        
        if (!imageUrl || !name) {
            alert("Please provide both an image URL and a product name.");
            return;
        }

        try {
            await db.collection('products').add({
                name: name,
                weight: document.getElementById('weight').value,
                price: parseFloat(document.getElementById('price').value) || 0,
                discountedPrice: parseFloat(document.getElementById('discount').value) || 0,
                category: document.getElementById('category').value,
                imageUrl: imageUrl,
                qty: 0,
                inWatchlist: false
            });

            alert("Success! Product added to RT Online Mart.");
            location.reload(); 
        } catch (error) {
            console.error("Error adding product: ", error);
            alert("Error: " + error.message);
        }
    }
</script>

</body>
</html>
