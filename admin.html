<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RT Online Mart - Admin Portal</title>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #707070;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .nav-bar {
            width: 100%;
            max-width: 800px;
            margin-bottom: 20px;
            display: flex;
            justify-content: flex-end;
        }
        .nav-link-btn {
            background-color: #004d00;
            color: white;
            padding: 10px 15px;
            text-decoration: none;
            border-radius: 4px;
            font-weight: bold;
            font-size: 15px;
        }
        .nav-link-btn:hover {
            background-color: #003300;
        }
        .container {
            width: 100%;
            max-width: 800px;
            background: #fff;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .table-container {
            width: 100%;
            max-width: 1100px;
            background: #fff;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            overflow-x: auto;
        }
        h2, h3 {
            color: #000;
        }
        label {
            display: block;
            margin-top: 10px;
            font-weight: bold;
            color: #000;
        }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            margin-bottom: 15px;
            border: 1px solid #444;
            border-radius: 4px;
            box-sizing: border-box;
            background: #fff;
        }
        button {
            background-color: #006400;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }
        button:hover {
            background-color: #004d00;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
            font-size: 14px;
            vertical-align: top;
        }
        th {
            background-color: #f4f4f4;
            color: #333;
        }
        img.thumb {
            width: 40px;
            height: 40px;
            object-fit: cover;
            border-radius: 4px;
        }
        .action-btns button {
            padding: 6px 10px;
            font-size: 12px;
            margin-right: 5px;
            margin-bottom: 5px;
        }
        .btn-edit {
            background-color: #ff8c00;
        }
        .btn-edit:hover {
            background-color: #e07b00;
        }
        .btn-delete {
            background-color: #b22222;
        }
        .btn-delete:hover {
            background-color: #8b0000;
        }
    </style>
</head>
<body>

<!-- Navigation to Manage Orders Page -->
<div class="nav-bar">
    <a href="manage_orders.html" class="nav-link-btn">📦 Manage Customer Orders &rarr;</a>
</div>

<!-- Daily Announcement Management Section -->
<div class="container">
    <h2>RT Online Mart - Daily Offer Announcement</h2>
    <label for="dailyMessageInput">Today's Offer / Message</label>
    <input type="text" id="dailyMessageInput" placeholder="e.g. Today offer, you will get onion only for 5 rupees shopping above 150">
    <button onclick="saveDailyMessage()">Update Daily Message</button>
</div>

<!-- Add/Edit Product Section -->
<div class="container">
    <h2 id="form-title">RT Online Mart - Add Product</h2>
    <input type="hidden" id="editProductId" value="">

    <label for="imageUrlInput">Cloudflare R2 Image Public URL</label>
    <input type="text" id="imageUrlInput" placeholder="Paste R2 public URL here">

    <label for="name">Product Name</label>
    <input type="text" id="name" placeholder="Product Name">

    <label for="price">Regular Price</label>
    <input type="number" id="price" placeholder="Price (Rupees)">

    <label for="discount">Discounted Price (Optional)</label>
    <input type="number" id="discount" placeholder="Discounted Price (Optional)">

    <label for="category">Category</label>
    <select id="category">
        <option value="Grocery">Grocery</option>
        <option value="Fruits">Fruits</option>
        <option value="Vegetables">Vegetables</option>
        <option value="Drinks">Drinks</option>
        <option value="Dairy">Dairy</option>
        <option value="Meat">Meat</option>
        <option value="Home">Home</option>
    </select>

    <button id="submitBtn" onclick="saveProduct()">Add Product to Database</button>
    <button id="cancelBtn" onclick="resetForm()" style="background-color: #555; display:none; margin-left: 10px;">Cancel Edit</button>
</div>

<!-- Manage Existing Products Table -->
<div class="table-container">
    <h3>Manage Existing Products</h3>
    <table aria-label="Product Management Table">
        <thead>
            <tr>
                <th>Image</th>
                <th>Name</th>
                <th>Category</th>
                <th>Price (₹)</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="productTableBody">
            <!-- Products will be loaded dynamically via JS -->
        </tbody>
    </table>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDIoAwjZsgAaMbVDjPQ_MPoQGbXWX5PBbw",
        authDomain: "rt-online-mart.firebaseapp.com",
        databaseURL: "https://rt-online-mart-default-rtdb.firebaseio.com",
        projectId: "rt-online-mart",
        messagingSenderId: "753183334962",
        appId: "1:753183334962:web:e7c4fb4fae141b3c7e122b",
        measurementId: "G-EQBHD3NH4M"
    };
    
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // Load current daily message in real-time
    db.collection('settings').doc('daily_message').onSnapshot((doc) => {
        if (doc.exists) {
            document.getElementById('dailyMessageInput').value = doc.data().message || '';
        }
    });

    // Save/Update daily message function
    async function saveDailyMessage() {
        const messageText = document.getElementById('dailyMessageInput').value.trim();
        try {
            await db.collection('settings').doc('daily_message').set({
                message: messageText,
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            });
            alert("Success! Daily message updated.");
        } catch (error) {
            console.error("Error updating daily message: ", error);
            alert("Error: " + error.message);
        }
    }

    // Load products into the table in real-time
    db.collection('products').onSnapshot((snapshot) => {
        const tbody = document.getElementById('productTableBody');
        tbody.innerHTML = '';

        if (snapshot.empty) {
            tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">No products found.</td></tr>';
            return;
        }

        snapshot.forEach((doc) => {
            const prod = doc.data();
            const id = doc.id;
            
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><img src="${prod.imageUrl || ''}" alt="" class="thumb" onerror="this.src='https://via.placeholder.com/40'"></td>
                <td>${escapeHtml(prod.name || '')}</td>
                <td>${escapeHtml(prod.category || '')}</td>
                <td>₹${prod.price || 0}</td>
                <td class="action-btns">
                    <button class="btn-edit" onclick="editProduct('${id}', '${escapeAttr(prod.name)}', '${prod.price}', '${prod.discountedPrice || 0}', '${escapeAttr(prod.category)}', '${escapeAttr(prod.imageUrl)}')">Edit</button>
                    <button class="btn-delete" onclick="deleteProduct('${id}')">Delete</button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    });

    async function saveProduct() {
        const editId = document.getElementById('editProductId').value;
        const imageUrl = document.getElementById('imageUrlInput').value.trim();
        const name = document.getElementById('name').value.trim();
        
        if (!imageUrl || !name) {
            alert("Please provide both an image URL and a product name.");
            return;
        }

        const productData = {
            name: name,
            price: parseFloat(document.getElementById('price').value) || 0,
            discountedPrice: parseFloat(document.getElementById('discount').value) || 0,
            category: document.getElementById('category').value,
            imageUrl: imageUrl
        };

        try {
            if (editId) {
                await db.collection('products').doc(editId).update(productData);
                alert("Success! Product updated.");
            } else {
                productData.qty = 0;
                productData.inWatchlist = false;
                await db.collection('products').add(productData);
                alert("Success! Product added to RT Online Mart.");
            }
            resetForm();
        } catch (error) {
            console.error("Error saving product: ", error);
            alert("Error: " + error.message);
        }
    }

    function editProduct(id, name, price, discount, category, imageUrl) {
        document.getElementById('editProductId').value = id;
        document.getElementById('imageUrlInput').value = imageUrl;
        document.getElementById('name').value = name;
        document.getElementById('price').value = price;
        document.getElementById('discount').value = discount;
        document.getElementById('category').value = category;

        document.getElementById('form-title').innerText = "RT Online Mart - Edit Product";
        document.getElementById('submitBtn').innerText = "Update Product";
        document.getElementById('cancelBtn').style.display = "inline-block";
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    async function deleteProduct(id) {
        if (confirm("Are you sure you want to delete this product?")) {
            try {
                await db.collection('products').doc(id).delete();
                alert("Product deleted successfully.");
            } catch (error) {
                console.error("Error deleting product: ", error);
                alert("Error deleting product: " + error.message);
            }
        }
    }

    function resetForm() {
        document.getElementById('editProductId').value = '';
        document.getElementById('imageUrlInput').value = '';
        document.getElementById('name').value = '';
        document.getElementById('price').value = '';
        document.getElementById('discount').value = '';
        document.getElementById('category').selectedIndex = 0;

        document.getElementById('form-title').innerText = "RT Online Mart - Add Product";
        document.getElementById('submitBtn').innerText = "Add Product to Database";
        document.getElementById('cancelBtn').style.display = "none";
    }

    function escapeHtml(str) {
        return (str || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    function escapeAttr(str) {
        return (str || '').replace(/'/g, "\\'").replace(/"/g, "&quot;");
    }
</script>

</body>
</html>
